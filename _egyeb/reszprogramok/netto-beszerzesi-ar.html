<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Eszközök: Márkák és Árak</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .tool-card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid;
        }
        .tool-brand { border-color: #f39c12; }
        .tool-price { border-color: #4CAF50; }
        
        h2 { margin-top: 0; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .file-upload { margin-bottom: 20px; padding: 15px; background: #e9ecef; border-radius: 6px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        
        /* Új stílus a státusz üzenetnek */
        .status-info {
            margin-top: 10px;
            padding: 10px;
            background-color: #fff;
            border-left: 4px solid #008CBA;
            font-size: 14px;
            display: none;
        }

        button {
            color: white; padding: 12px 20px; border: none;
            border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s;
            margin-bottom: 10px;
        }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; }
        
        .btn-brand { background-color: #f39c12; }
        .btn-brand:hover { background-color: #e67e22; }
        
        .btn-price { background-color: #4CAF50; }
        .btn-price:hover { background-color: #45a049; }

        .btn-download { background-color: #008CBA; display: none; }
        .btn-download:hover { background-color: #007B9E; }

        .brands-preview { margin-top: 20px; }
        #brandsList { list-style-type: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
        #brandsList li { background: #eee; padding: 5px 15px; border-radius: 20px; font-size: 14px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="tool-card tool-brand">
        <h2>1. Eszköz: Márka Kigyűjtő</h2>
        <p>Tölts fel egy Excel fájlt ("Márka" oszloppal).</p>
        
        <div class="file-upload">
            <label for="brandFile">Excel fájl feltöltése:</label>
            <input type="file" id="brandFile" accept=".xlsx, .xls">
        </div>

        <button class="btn-brand" id="brandProcessBtn" onclick="extractBrands()">Márkák kigyűjtése</button>
        <button class="btn-download" id="brandDownloadBtn">Kigyűjtött Márkák letöltése (Excel)</button>

        <div class="brands-preview">
            <ul id="brandsList"></ul>
        </div>
    </div>

    <div class="tool-card tool-price">
        <h2>2. Eszköz: Árfrissítő</h2>
        <p>Azonosítás: <strong>"Cikkszám"</strong> | Frissítés: <strong>"Nettó beszerzési ár"</strong></p>
        
        <div class="file-upload">
            <label for="baseFile">Alap Excel fájl (hiányos árak):</label>
            <input type="file" id="baseFile" accept=".xlsx, .xls" onchange="analyzeBaseFile(this)">
            <div id="baseFileStatus" class="status-info"></div>
        </div>

        <div class="file-upload">
            <label for="refFile">Referencia Excel fájl (árakkal):</label>
            <input type="file" id="refFile" accept=".xlsx, .xls">
        </div>

        <button class="btn-price" id="priceProcessBtn" onclick="updatePrices()">Árak frissítése</button>
        <button class="btn-download" id="priceDownloadBtn">Frissített Excel letöltése</button>
    </div>

</div>

<script>
    function readFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                resolve(workbook);
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    // --- ÚJ FUNKCIÓ: ALAP FÁJL ELEMZÉSE ---
    async function analyzeBaseFile(input) {
        const file = input.files[0];
        const statusDiv = document.getElementById('baseFileStatus');
        
        if (!file) {
            statusDiv.style.display = "none";
            return;
        }

        statusDiv.style.display = "block";
        statusDiv.innerHTML = "<i>Fájl elemzése...</i>";

        try {
            const wb = await readFile(file);
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            
            const totalRows = data.length;
            let missingPrices = 0;

            data.forEach(row => {
                const ar = row["Nettó beszerzési ár"];
                // Ellenőrizzük, hogy üres-e (üres string, null vagy undefined)
                if (ar === "" || ar === null || ar === undefined) {
                    missingPrices++;
                }
            });

            statusDiv.innerHTML = `
                <strong>Elemzés kész:</strong><br>
                Összes termék a fájlban: <strong>${totalRows} db</strong><br>
                Ebből hiányzó beszerzési ár: <strong style="color: #e74c3c;">${missingPrices} db</strong>
            `;
        } catch (error) {
            statusDiv.innerHTML = "<span style='color: red;'>Hiba: Nem sikerült beolvasni az oszlopokat (Nettó beszerzési ár hiányzik?)</span>";
        }
    }

    // --- 1. ESZKÖZ: MÁRKA KIGYŰJTŐ ---
    async function extractBrands() {
        const fileInput = document.getElementById('brandFile').files[0];
        if (!fileInput) return alert("Válassz fájlt!");

        const btn = document.getElementById('brandProcessBtn');
        btn.disabled = true;

        try {
            const wb = await readFile(fileInput);
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            const brands = new Set();
            data.forEach(row => {
                if (row["Márka"]) brands.add(row["Márka"].toString().trim());
            });

            const sortedBrands = [...brands].sort();
            const brandsList = document.getElementById('brandsList');
            brandsList.innerHTML = "";
            
            sortedBrands.forEach(brand => {
                const li = document.createElement('li');
                li.textContent = brand;
                brandsList.appendChild(li);
            });

            const brandSheet = XLSX.utils.json_to_sheet(sortedBrands.map(b => ({"Kigyűjtött Márkák": b})));
            const brandWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(brandWb, brandSheet, "Márkák");

            const dlBtn = document.getElementById('brandDownloadBtn');
            dlBtn.style.display = "block";
            dlBtn.onclick = () => XLSX.writeFile(brandWb, "Kigyujtott_Markak.xlsx");
            
            alert("Márkák kigyűjtve!");
        } catch (e) { alert("Hiba történt!"); }
        finally { btn.disabled = false; }
    }

    // --- 2. ESZKÖZ: ÁRFRISSÍTŐ ---
    async function updatePrices() {
        const baseFileInput = document.getElementById('baseFile').files[0];
        const refFileInput = document.getElementById('refFile').files[0];

        if (!baseFileInput || !refFileInput) return alert("Mindkét fájl kell!");

        const processBtn = document.getElementById('priceProcessBtn');
        processBtn.disabled = true;

        try {
            const baseWb = await readFile(baseFileInput);
            const refWb = await readFile(refFileInput);

            const baseData = XLSX.utils.sheet_to_json(baseWb.Sheets[baseWb.SheetNames[0]], { defval: "" });
            const refData = XLSX.utils.sheet_to_json(refWb.Sheets[refWb.SheetNames[0]], { defval: "" });

            const priceDict = {};
            refData.forEach(row => {
                if (row["Cikkszám"] && row["Nettó beszerzési ár"]) {
                    priceDict[row["Cikkszám"].toString().trim()] = row["Nettó beszerzési ár"];
                }
            });

            let updatedCount = 0;
            baseData.forEach(row => {
                const ar = row["Nettó beszerzési ár"];
                const id = row["Cikkszám"];
                if ((ar === "" || ar === null || ar === undefined) && id) {
                    const cleanId = id.toString().trim();
                    if (priceDict[cleanId] !== undefined) {
                        row["Nettó beszerzési ár"] = priceDict[cleanId];
                        updatedCount++;
                    }
                }
            });

            const newSheet = XLSX.utils.json_to_sheet(baseData);
            const newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, newSheet, "Frissített");

            const dlBtn = document.getElementById('priceDownloadBtn');
            dlBtn.style.display = "block";
            dlBtn.onclick = () => XLSX.writeFile(newWb, "Frissitett_Lista.xlsx");

            alert(`Kész! ${updatedCount} tétel pótolva.`);
        } catch (e) { alert("Hiba történt a feldolgozáskor!"); }
        finally { processBtn.disabled = false; }
    }
</script>

</body>
</html>
