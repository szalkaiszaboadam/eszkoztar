<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Eszközök: Márkák és Árak</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .tool-card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid;
        }
        .tool-brand { border-color: #f39c12; }
        .tool-price { border-color: #4CAF50; }
        
        h2 { margin-top: 0; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .file-upload { margin-bottom: 20px; padding: 15px; background: #e9ecef; border-radius: 6px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        
        button {
            color: white; padding: 12px 20px; border: none;
            border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s;
            margin-bottom: 10px;
        }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; }
        
        .btn-brand { background-color: #f39c12; }
        .btn-brand:hover { background-color: #e67e22; }
        
        .btn-price { background-color: #4CAF50; }
        .btn-price:hover { background-color: #45a049; }

        .btn-download { background-color: #008CBA; display: none; }
        .btn-download:hover { background-color: #007B9E; }

        .brands-preview { margin-top: 20px; }
        #brandsList { list-style-type: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
        #brandsList li { background: #eee; padding: 5px 15px; border-radius: 20px; font-size: 14px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="tool-card tool-brand">
        <h2>1. Eszköz: Márka Kigyűjtő</h2>
        <p>Tölts fel egy Excel fájlt, amely tartalmaz egy <strong>"Márka"</strong> nevű oszlopot. A program kigyűjti a benne lévő egyedi márkákat.</p>
        
        <div class="file-upload">
            <label for="brandFile">Excel fájl feltöltése:</label>
            <input type="file" id="brandFile" accept=".xlsx, .xls">
        </div>

        <button class="btn-brand" id="brandProcessBtn" onclick="extractBrands()">Márkák kigyűjtése</button>
        <button class="btn-download" id="brandDownloadBtn">Kigyűjtött Márkák letöltése (Excel)</button>

        <div class="brands-preview">
            <ul id="brandsList"></ul>
        </div>
    </div>

    <div class="tool-card tool-price">
        <h2>2. Eszköz: Árfrissítő</h2>
        <p>A hiányos árak pótlása a <strong>"Cikkszám"</strong> alapján a <strong>"Nettó beszerzési ár"</strong> oszlopba.</p>
        
        <div class="file-upload">
            <label for="baseFile">Alap Excel fájl (amelyikben hiányoznak az árak):</label>
            <input type="file" id="baseFile" accept=".xlsx, .xls">
        </div>

        <div class="file-upload">
            <label for="refFile">Referencia Excel fájl (amelyikben benne vannak az árak):</label>
            <input type="file" id="refFile" accept=".xlsx, .xls">
        </div>

        <button class="btn-price" id="priceProcessBtn" onclick="updatePrices()">Árak frissítése</button>
        <button class="btn-download" id="priceDownloadBtn">Frissített Excel letöltése</button>
    </div>

</div>

<script>
    // Fájl beolvasó segédfüggvény
    function readFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                resolve(workbook);
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    // --- 1. ESZKÖZ LOGIKÁJA: MÁRKA KIGYŰJTŐ ---
    async function extractBrands() {
        const fileInput = document.getElementById('brandFile').files[0];
        if (!fileInput) {
            alert("Kérlek, töltsd fel az Excel fájlt a márkák kigyűjtéséhez!");
            return;
        }

        const processBtn = document.getElementById('brandProcessBtn');
        const downloadBtn = document.getElementById('brandDownloadBtn');
        const brandsList = document.getElementById('brandsList');
        
        try {
            processBtn.disabled = true;
            processBtn.innerText = "Feldolgozás...";

            const wb = await readFile(fileInput);
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });

            const brands = new Set();
            data.forEach(row => {
                const marka = row["Márka"];
                if (marka && marka.toString().trim() !== "") {
                    brands.add(marka.toString().trim());
                }
            });

            const sortedBrands = [...brands].sort();

            // Képernyő frissítése
            brandsList.innerHTML = "";
            if(sortedBrands.length === 0) {
                brandsList.innerHTML = "<li><i>Nem található 'Márka' nevű oszlop, vagy üres.</i></li>";
                downloadBtn.style.display = "none";
            } else {
                sortedBrands.forEach(brand => {
                    const li = document.createElement('li');
                    li.textContent = brand;
                    brandsList.appendChild(li);
                });

                // Excel fájl előkészítése letöltésre
                const brandExcelData = sortedBrands.map(b => ({"Kigyűjtött Márkák": b}));
                const brandSheet = XLSX.utils.json_to_sheet(brandExcelData);
                const brandWb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(brandWb, brandSheet, "Márkák");

                downloadBtn.style.display = "block";
                downloadBtn.onclick = () => {
                    XLSX.writeFile(brandWb, "Kigyujtott_Markak.xlsx");
                };
                
                alert(`Sikeresen kigyűjtve ${sortedBrands.length} db márka!`);
            }
        } catch (error) {
            console.error(error);
            alert("Hiba történt. Kérlek ellenőrizd a fájlt és a 'Márka' oszlopnevet.");
        } finally {
            processBtn.disabled = false;
            processBtn.innerText = "Márkák kigyűjtése";
        }
    }

    // --- 2. ESZKÖZ LOGIKÁJA: ÁRFRISSÍTŐ ---
    async function updatePrices() {
        const baseFileInput = document.getElementById('baseFile').files[0];
        const refFileInput = document.getElementById('refFile').files[0];

        if (!baseFileInput || !refFileInput) {
            alert("Kérlek, töltsd fel mindkét Excel fájlt az árak frissítéséhez!");
            return;
        }

        const processBtn = document.getElementById('priceProcessBtn');
        const downloadBtn = document.getElementById('priceDownloadBtn');

        try {
            processBtn.disabled = true;
            processBtn.innerText = "Feldolgozás...";

            const baseWb = await readFile(baseFileInput);
            const refWb = await readFile(refFileInput);

            const baseData = XLSX.utils.sheet_to_json(baseWb.Sheets[baseWb.SheetNames[0]], { defval: "" });
            const refData = XLSX.utils.sheet_to_json(refWb.Sheets[refWb.SheetNames[0]], { defval: "" });

            // Referencia szótár (Cikkszám -> Ár)
            const priceDict = {};
            refData.forEach(row => {
                const cikkszam = row["Cikkszám"];
                const ar = row["Nettó beszerzési ár"];
                if (cikkszam && ar !== "" && ar !== undefined) {
                    priceDict[cikkszam.toString().trim()] = ar;
                }
            });

            // Alap tábla frissítése
            let updatedCount = 0;
            baseData.forEach(row => {
                const jelenlegiAr = row["Nettó beszerzési ár"];
                const cikkszam = row["Cikkszám"];
                
                if ((jelenlegiAr === "" || jelenlegiAr === null || jelenlegiAr === undefined) && cikkszam) {
                    const tisztitottCikkszam = cikkszam.toString().trim();
                    if (priceDict[tisztitottCikkszam] !== undefined) {
                        row["Nettó beszerzési ár"] = priceDict[tisztitottCikkszam];
                        updatedCount++;
                    }
                }
            });

            // Új Excel fájl előkészítése
            const newSheet = XLSX.utils.json_to_sheet(baseData);
            const newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, newSheet, "Frissített_Árak");

            downloadBtn.style.display = "block";
            downloadBtn.onclick = () => {
                XLSX.writeFile(newWb, "Frissitett_Keszlet_Lista.xlsx");
            };

            alert(`Kész! ${updatedCount} tétel ára lett frissítve. Kattints a letöltés gombra!`);

        } catch (error) {
            console.error(error);
            alert("Hiba történt. Ellenőrizd a fájlokat és az oszlopneveket (Cikkszám, Nettó beszerzési ár).");
        } finally {
            processBtn.disabled = false;
            processBtn.innerText = "Árak frissítése";
        }
    }
</script>

</body>
</html>
