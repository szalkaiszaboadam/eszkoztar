<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profi Termék Kollázs - Változatokkal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5; color: #333;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .controls {
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 20px; align-items: center; width: 100%; max-width: 700px;
        }
        .file-upload-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

        /* Bélyegképek (Thumbnails) stílusa */
        #thumbnailContainer {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
            min-height: 70px; padding: 10px; background: #fafafa; border-radius: 8px; width: 100%; box-sizing: border-box;
        }
        .thumb-box { position: relative; width: 60px; height: 60px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .delete-btn {
            position: absolute; top: -5px; right: -5px; background: #e74c3c; color: white;
            border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px;
            cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold;
        }
        .delete-btn:hover { background: #c0392b; }

        .sliders { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .slider-row input { flex-grow: 1; margin: 0 15px; }

        button.primary-btn {
            background-color: #2c3e50; color: white; border: none; padding: 12px 25px;
            font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s; font-weight: bold; width: 100%;
        }
        button.primary-btn:hover { background-color: #1a252f; }

        /* Eredmények rácsa */
        #resultsWrapper {
            display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; width: 100%; max-width: 1200px;
        }
        .variation-card {
            background: white; padding: 15px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        canvas { display: block; width: 300px; height: 300px; border: 1px solid #eee; border-radius: 4px; }

        .download-btn {
            background-color: #27ae60; color: white; border: none; padding: 8px 15px;
            font-size: 14px; border-radius: 5px; cursor: pointer; transition: background 0.3s;
        }
        .download-btn:hover { background-color: #219653; }

        #loading {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white; padding: 20px 30px; border-radius: 8px; font-weight: bold; text-align: center; z-index: 100;
        }
    </style>
</head>
<body>

    <h1>Kollázs Generátor - Pro (Változatokkal)</h1>

    <div class="controls">
        <div class="file-upload-wrapper">
            <input type="file" id="imageInput" multiple accept="image/*">
            <small>Maximum 6 kép. Válassz ki többet is, vagy adj hozzájuk egyesével.</small>
            <div id="thumbnailContainer"></div>
        </div>

        <div class="sliders">
            <div class="slider-row">
                <label>Belső Margó (szélektől):</label>
                <input type="range" id="marginSlider" min="0" max="150" value="50">
                <span style="min-width: 40px; text-align: right;"><strong id="marginValue">50</strong>px</span>
            </div>
            <div class="slider-row">
                <label>Tárgyak közti rés:</label>
                <input type="range" id="gapSlider" min="0" max="60" value="15">
                <span style="min-width: 40px; text-align: right;"><strong id="gapValue">15</strong>px</span>
            </div>
        </div>

        <button id="generateBtn" class="primary-btn">3 Változat Generálása</button>
    </div>

    <div id="resultsWrapper"></div>
    <div id="loading">Feldolgozás és optimalizálás...<br><small>Több ezer variáció elemzése</small></div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const marginSlider = document.getElementById('marginSlider');
        const marginValue = document.getElementById('marginValue');
        const gapSlider = document.getElementById('gapSlider');
        const gapValue = document.getElementById('gapValue');
        const generateBtn = document.getElementById('generateBtn');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const loading = document.getElementById('loading');

        let activeFiles = []; // A memóriában tartott képek

        // Csúszkák frissítése
        marginSlider.addEventListener('input', e => marginValue.textContent = e.target.value);
        gapSlider.addEventListener('input', e => gapValue.textContent = e.target.value);

        // Fájl feltöltés és bélyegkép logika
        imageInput.addEventListener('change', (e) => {
            const newFiles = Array.from(e.target.files);
            if (activeFiles.length + newFiles.length > 6) {
                alert("Maximum 6 képet tölthetsz be összesen!");
            } else {
                activeFiles = [...activeFiles, ...newFiles].slice(0, 6);
                renderThumbnails();
            }
            imageInput.value = ""; // Töröljük az inputot, hogy újra lehessen ugyanazt is kiválasztani
        });

        function renderThumbnails() {
            thumbnailContainer.innerHTML = '';
            activeFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'thumb-box';
                    div.innerHTML = `
                        <img src="${e.target.result}" alt="thumb">
                        <button class="delete-btn" onclick="removeImage(${index})">X</button>
                    `;
                    thumbnailContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        window.removeImage = function(index) {
            activeFiles.splice(index, 1);
            renderThumbnails();
        }

        // Fő Generáló Logika
        generateBtn.addEventListener('click', async () => {
            if (activeFiles.length === 0) {
                alert("Kérlek adj hozzá képeket a generáláshoz!"); return;
            }

            loading.style.display = 'block';
            resultsWrapper.innerHTML = ''; // Előző eredmények törlése

            const gap = parseInt(gapSlider.value);
            const externalMargin = parseInt(marginSlider.value);

            // UI frissítés engedése mielőtt a szinkron JS megakasztaná a szálat
            setTimeout(async () => {
                try {
                    const images = await Promise.all(activeFiles.map(file => loadImage(file)));
                    const croppedImages = images.map(img => processAndCropImage(img));
                    generateVariations(croppedImages, gap, externalMargin);
                } catch (err) {
                    console.error(err);
                    alert("Hiba történt a generálás során.");
                } finally {
                    loading.style.display = 'none';
                }
            }, 50);
        });

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function processAndCropImage(img) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width; tempCanvas.height = img.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(img, 0, 0);

            const imageData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imageData.data;
            let minX = tempCanvas.width, minY = tempCanvas.height, maxX = 0, maxY = 0;

            for (let y = 0; y < tempCanvas.height; y++) {
                for (let x = 0; x < tempCanvas.width; x++) {
                    const idx = (y * tempCanvas.width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
                    if (a > 20 && !(r > 235 && g > 235 && b > 235)) {
                        if (x < minX) minX = x; if (x > maxX) maxX = x;
                        if (y < minY) minY = y; if (y > maxY) maxY = y;
                    } else {
                        data[idx+3] = 0;
                    }
                }
            }
            tCtx.putImageData(imageData, 0, 0);

            const cropW = maxX - minX + 1; const cropH = maxY - minY + 1;
            const croppedCanvas = document.createElement('canvas');
            if (cropW <= 0) return { canvas: tempCanvas, width: tempCanvas.width, height: tempCanvas.height, ar: 1 };

            croppedCanvas.width = cropW; croppedCanvas.height = cropH;
            croppedCanvas.getContext('2d').drawImage(tempCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

            return { canvas: croppedCanvas, width: cropW, height: cropH, ar: cropW / cropH };
        }

        function getPermutations(arr) {
            if (arr.length <= 1) return [arr];
            const result = [];
            for (let i = 0; i < arr.length; i++) {
                const current = arr[i];
                const remaining = [...arr.slice(0, i), ...arr.slice(i + 1)];
                const remainingPerms = getPermutations(remaining);
                for (let perm of remainingPerms) { result.push([current, ...perm]); }
            }
            return result;
        }

        function getPartitions(n) {
            if (n === 0) return [];
            const result = [];
            const numSplits = 1 << (n - 1);
            for (let i = 0; i < numSplits; i++) {
                let currentPartition = [];
                let currentCount = 1;
                for (let j = 0; j < n - 1; j++) {
                    if ((i & (1 << j)) !== 0) {
                        currentPartition.push(currentCount); currentCount = 1;
                    } else { currentCount++; }
                }
                currentPartition.push(currentCount);
                result.push(currentPartition);
            }
            return result;
        }

        // Generálja a 3 legjobb vizuális változatot
        function generateVariations(images, gap, externalMargin) {
            const targetW = 1000;
            const perms = getPermutations(images);
            const parts = getPartitions(images.length);

            let allLayouts = [];

            for (let perm of perms) {
                for (let part of parts) {
                    let totalH = 0;
                    let valid = true;
                    let imgIdx = 0;
                    let rowData = [];
                    let rowHeights = [];

                    for (let count of part) {
                        let sumAR = 0;
                        for (let i = 0; i < count; i++) {
                            sumAR += perm[imgIdx + i].ar;
                        }

                        let availW = targetW - (count - 1) * gap;
                        if (availW <= 0) { valid = false; break; }

                        let rowH = availW / sumAR;
                        rowHeights.push(rowH);
                        totalH += rowH;

                        rowData.push({ count, rowH, sumAR, startIndex: imgIdx });
                        imgIdx += count;
                    }

                    if (!valid) continue;
                    totalH += (part.length - 1) * gap;

                    // --- BÜNTETŐPONT RENDSZER A KIEGYENSÚLYOZOTT MÉRETEKÉRT ---
                    const maxH = Math.max(...rowHeights);
                    const minH = Math.min(...rowHeights);
                    const heightRatio = maxH / minH;

                    // Alapvető eltérés a tökéletes négyzettől
                    let diffScore = Math.abs(totalH - targetW);

                    // Ha egy sor több mint 1.8-szor magasabb a legkisebbnél, brutálisan megbüntetjük,
                    // így az algoritmus hátra sorolja és nem választja ki.
                    if (heightRatio > 1.8) {
                        diffScore += (heightRatio * 5000);
                    }

                    allLayouts.push({
                        score: diffScore,
                        layout: { perm, part, rowData, totalH, targetW, signature: part.join('-') }
                    });
                }
            }

            // Sorrendbe rakjuk a legjobb (legkisebb hibapontú) találatokat
            allLayouts.sort((a, b) => a.score - b.score);

            // Kiválasztjuk a top 3-at úgy, hogy igyekszünk KÜLÖNBÖZŐ felosztásokat találni (pl egy 2-2 és egy 1-3 elrendezést is)
            let topLayouts = [];
            let seenSignatures = new Set();

            for (let item of allLayouts) {
                if (!seenSignatures.has(item.layout.signature)) {
                    topLayouts.push(item.layout);
                    seenSignatures.add(item.layout.signature);
                }
                if (topLayouts.length === 3) break;
            }

            // Ha nem volt 3 különböző formai felosztás (pl csak 3 képet töltött fel), akkor csak simán feltöltjük a legjobbakkal
            if (topLayouts.length < 3) {
                for (let item of allLayouts) {
                    if (!topLayouts.includes(item.layout)) topLayouts.push(item.layout);
                    if (topLayouts.length === 3) break;
                }
            }

            // --- Végül megrajzoljuk a 3 vásznat ---
            topLayouts.forEach((layout, index) => {
                createCanvasCard(layout, gap, externalMargin, index + 1);
            });
        }

        // Segédfüggvény egy kártya (Vászon + Gomb) létrehozására
        function createCanvasCard(layout, gap, externalMargin, variationNumber) {
            const card = document.createElement('div');
            card.className = 'variation-card';

            const canvas = document.createElement('canvas');
            canvas.width = 1000;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');

            // Fehér háttér
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Kiszámoljuk a végső méretezést figyelembe véve a külső margót
            const maxDrawArea = 1000 - (externalMargin * 2);
            const finalScale = Math.min(maxDrawArea / layout.targetW, maxDrawArea / layout.totalH);

            const finalBlockW = layout.targetW * finalScale;
            const finalBlockH = layout.totalH * finalScale;

            const offsetX = (canvas.width - finalBlockW) / 2;
            const offsetY = (canvas.height - finalBlockH) / 2;

            let currentY = offsetY;

            for (let row of layout.rowData) {
                let currentX = offsetX;
                let finalRowH = row.rowH * finalScale;
                let finalGap = gap * finalScale;

                for (let i = 0; i < row.count; i++) {
                    let imgItem = layout.perm[row.startIndex + i];
                    let finalImgW = (imgItem.ar * row.rowH) * finalScale;

                    ctx.drawImage(imgItem.canvas, currentX, currentY, finalImgW, finalRowH);
                    currentX += finalImgW + finalGap;
                }
                currentY += finalRowH + finalGap;
            }

            const title = document.createElement('strong');
            title.textContent = `Változat #${variationNumber}`;

            const btn = document.createElement('button');
            btn.className = 'download-btn';
            btn.textContent = 'Letöltés PNG';
            btn.onclick = () => {
                const link = document.createElement('a');
                link.download = `kollazs_v${variationNumber}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

            card.appendChild(title);
            card.appendChild(canvas);
            card.appendChild(btn);
            resultsWrapper.appendChild(card);
        }
    </script>
</body>
</html>
